<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Тло (круг у стилі KDE) -->
  <circle cx="24" cy="24" r="22" fill="#3daee9" opacity="0.2"/>

  <!-- Графік (лінія стабільності) -->
